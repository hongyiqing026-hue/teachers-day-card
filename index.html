<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>致亲爱的刘老师</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f0e6;
      height: 100vh;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    .page.active {
      display: flex;
    }


    /* =========================
       第一页
    ========================= */

    #p1 {
      background:
        linear-gradient(
          135deg,
          #f8f1e3,
          #e8d9c4
        );

      text-align: center;
      padding: 20px;
    }

    #p1 h1 {
      font-size: 48px;
      color: #8b5a2b;
      margin-bottom: 20px;
    }

    #p1 p {
      font-size: 18px;
      color: #7a6a5a;
      margin-bottom: 40px;
    }

    #p1 button {
      padding: 15px 40px;

      background: #8b5a2b;
      color: white;

      border: none;
      border-radius: 30px;

      font-size: 18px;
      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(100,70,40,.18);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    #p1 button:active {
      transform: scale(.96);
    }


    /* =========================
       音乐按钮
    ========================= */

    #musicBtn {
      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 100;

      padding: 8px 14px;

      border:
        1px solid
        rgba(139,90,43,.25);

      border-radius: 20px;

      background:
        rgba(255,250,240,.78);

      color: #8b5a2b;

      font-size: 12px;

      cursor: pointer;

      display: none;

      backdrop-filter: blur(5px);
    }

    #musicBtn.show {
      display: block;
    }


    /* =========================
       花瓣
    ========================= */

    #petals {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      overflow: hidden;

      z-index: 50;
    }

    .petal {
      position: absolute;

      top: -30px;

      width: 12px;
      height: 8px;

      background:
        rgba(214,132,126,.45);

      border-radius:
        100% 0 100% 0;

      animation:
        petalFall linear infinite,
        petalSway ease-in-out infinite;

      opacity: .6;
    }

    @keyframes petalFall {

      0% {
        top: -30px;
        opacity: 0;
      }

      10% {
        opacity: .65;
      }

      85% {
        opacity: .55;
      }

      100% {
        top: 110vh;
        opacity: 0;
      }

    }

    @keyframes petalSway {

      0% {
        margin-left: 0;
      }

      25% {
        margin-left: 35px;
      }

      50% {
        margin-left: -25px;
      }

      75% {
        margin-left: 30px;
      }

      100% {
        margin-left: 0;
      }

    }


    /* =========================
       第二页：信封
    ========================= */

    #p2 {
      background:
        linear-gradient(
          135deg,
          #eee3d0,
          #e0d0b7
        );
    }

    .envelope-area {
      width: 340px;
      height: 300px;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .box {
      width: 300px;
      height: 200px;

      background: #f0e6d4;

      border:
        3px solid
        #d9cbb0;

      border-radius: 8px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.2);

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      overflow: visible;

      perspective: 800px;
    }


    /* =========================
       信封里的信纸
    ========================= */

    .hidden-letter {
      position: absolute;

      width: 260px;
      height: 330px;

      background: #faf6ef;

      left: 20px;
      top: 10px;

      border-radius: 4px;

      box-shadow:
        0 8px 25px
        rgba(80,50,20,.16);

      opacity: 0;

      transform:
        translateY(130px)
        scale(.94);

      transition:
        transform 1s
        cubic-bezier(.2,.8,.2,1),

        opacity .35s ease;

      pointer-events: none;
    }


    /* =========================
       信封盖子
    ========================= */

    .envelope-flap {
      position: absolute;

      left: 0;
      top: 0;

      width: 300px;
      height: 105px;

      background: #e5d6bd;

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin:
        top center;

      z-index: 5;

      transition:
        transform .85s
        cubic-bezier(.2,.75,.2,1);
    }


    /* =========================
       信封文字
    ========================= */

    .envelope-text {
      position: absolute;

      left: 50%;
      top: 95px;

      transform:
        translateX(-50%);

      width: 90%;

      text-align: center;

      color: #8b5a2b;

      font-size: 15px;

      line-height: 1.6;

      white-space: nowrap;

      z-index: 4;

      transition:
        opacity .35s ease;
    }


    /* =========================
       印章
    ========================= */

    .seal {
      width: 70px;
      height: 70px;

      background: #c0392b;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #ffe6b4;

      font-size: 32px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 6px 16px
        rgba(100,20,20,.35);

      z-index: 10;

      transition:
        transform .3s ease,
        opacity .35s ease;
    }

    .seal:active {
      transform: scale(.95);
    }


    /* =========================
       提示文字
    ========================= */

    .msg {
      position: absolute;

      bottom: -50px;

      font-size: 14px;

      color: #8a7a6a;

      transition:
        opacity .3s ease;
    }


    /* =========================
       信封打开动画
    ========================= */

    .box.open .envelope-flap {
      transform:
        rotateX(180deg);
    }

    .box.open .seal {
      opacity: 0;

      transform:
        scale(.65);
    }

    .box.open .envelope-text {
      opacity: 0;
    }

    .box.open .hidden-letter {
      opacity: 1;

      transform:
        translateY(-185px)
        scale(1);

      z-index: 20;
    }

    .box.open .msg {
      opacity: 0;
    }


    /* =========================
       第三页：信纸
    ========================= */

    #p3 {
      background:
        linear-gradient(
          180deg,
          #f5efe4,
          #ebe2d2
        );

      overflow-y: auto;

      padding: 20px;

      opacity: 0;

      transform:
        translateY(20px);

      transition:
        opacity .6s ease,
        transform .6s ease;
    }

    #p3.active {
      opacity: 1;

      transform:
        translateY(0);
    }

    .letter {
      width: 100%;

      max-width: 420px;

      background: #faf6ef;

      padding: 40px 20px;

      border-radius: 4px;

      box-shadow:
        0 8px 32px
        rgba(80,50,20,.12);

      animation:
        letterAppear .8s
        cubic-bezier(.2,.8,.2,1);
    }

    @keyframes letterAppear {

      from {
        opacity: 0;

        transform:
          translateY(60px)
          scale(.95);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

    .letter h2 {
      text-align: center;

      color: #8b5a2b;

      margin-bottom: 20px;
    }

    .letter textarea {
      width: 100%;

      height: 300px;

      padding: 15px;

      font-size: 15px;

      border:
        1px solid
        #e8dfd0;

      border-radius: 3px;

      resize: none;

      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

      background: #fffdf8;

      color: #5e5145;

      outline: none;

      line-height: 1.8;
    }

    .letter textarea:focus {
      border-color:
        #c9a989;
    }

    .letter .date {
      text-align: right;

      font-size: 12px;

      color: #9a8a7a;

      margin: 10px 0;
    }

    .letter button {
      width: 100%;

      padding: 12px;

      background: #8b5a2b;

      color: white;

      border: none;

      border-radius: 25px;

      cursor: pointer;

      font-size: 16px;

      margin-top: 15px;
    }


    /* =========================
       第四页
    ========================= */

    #p4 {
      background:
        linear-gradient(
          160deg,
          #f8f1e3,
          #d9c4a8
        );

      text-align: center;

      padding: 20px;
    }

    #p4 h1 {
      font-size: 44px;

      color: #8b5a2b;

      margin-bottom: 40px;

      animation:
        finalAppear .9s ease;
    }

    .seal2 {
      width: 90px;
      height: 90px;

      background: #c0392b;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #ffe6b4;

      font-size: 44px;

      font-weight: bold;

      margin: 0 auto;

      box-shadow:
        0 6px 16px
        rgba(100,20,20,.3);

      animation:
        sealAppear 1s
        cubic-bezier(.2,.8,.2,1);
    }

    @keyframes finalAppear {

      from {
        opacity: 0;

        transform:
          translateY(25px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }

    @keyframes sealAppear {

      from {
        opacity: 0;

        transform:
          scale(.5)
          rotate(-20deg);
      }

      to {
        opacity: 1;

        transform:
          scale(1)
          rotate(0);
      }

    }


    /* =========================
       手机适配
    ========================= */

    @media (max-width: 600px) {

      #p1 h1 {
        font-size: 30px;

        line-height: 1.5;

        margin-bottom: 15px;
      }

      #p1 p {
        font-size: 16px;

        margin-bottom: 30px;
      }

      #p1 button {
        padding:
          13px 34px;

        font-size: 16px;
      }

      .envelope-area {
        transform:
          scale(.9);
      }

      .letter {
        max-width: 390px;

        padding:
          35px 18px;
      }

      .letter textarea {
        height: 280px;

        font-size: 14px;
      }

      #p4 h1 {
        font-size: 38px;
      }

      #musicBtn {
        top: 12px;
        right: 12px;

        font-size: 11px;
      }

    }


    @media (max-width: 380px) {

      .envelope-area {
        transform:
          scale(.82);
      }

      #p1 h1 {
        font-size: 27px;
      }

      .envelope-text {
        font-size: 13px;
      }

    }

  </style>
</head>


<body>


<!-- =========================
     花瓣
========================= -->

<div id="petals"></div>


<!-- =========================
     音乐按钮
========================= -->

<button id="musicBtn">
  ♫ 音乐：关闭
</button>


<!-- =========================
     第一页
========================= -->

<div id="p1" class="page active">

  <h1>
    致亲爱的刘老师
  </h1>

  <p>
    教师节 · 专属祝福
  </p>

  <button onclick="startExperience()">
    打开信封
  </button>

</div>


<!-- =========================
     第二页：信封
========================= -->

<div id="p2" class="page">

  <div class="envelope-area">

    <div class="box" id="envelopeBox">


      <!-- 信封里面的信纸 -->

      <div class="hidden-letter">
      </div>


      <!-- 信封文字 -->

      <div class="envelope-text">
        教師の日おめでとうございます！ 🌸
      </div>


      <!-- 印章 -->

      <div
        class="seal"
        onclick="openEnvelope()">

        師

      </div>


      <!-- 信封盖 -->

      <div class="envelope-flap">
      </div>


      <!-- 提示文字 -->

      <div class="msg">
        点击印章打开
      </div>

    </div>

  </div>

</div>


<!-- =========================
     第三页：信纸
========================= -->

<div id="p3" class="page">

  <div class="letter">

    <h2>
      亲爱的刘老师
    </h2>


    <textarea
      id="txt"
      placeholder="写下你的祝福..."></textarea>


    <div
      class="date"
      id="d">
    </div>


    <button onclick="show(4)">
      完成 · 祝福
    </button>

  </div>

</div>


<!-- =========================
     第四页
========================= -->

<div id="p4" class="page">

  <h1>
    教师节快乐
  </h1>

  <div class="seal2">
    師
  </div>

</div>


<script>


/* =====================================
   信件正文
===================================== */

const txt = `亲爱的刘老师

老师好，教师节快乐啊

感谢您一直以来的教导，虽然我听的不咋认真，但我真切被您的责任心与真诚感染，所以笔译课我会好好听讲的（我尽力）

祝您身体健康，万事如意，教师节快乐！`;


/* =====================================
   页面切换
===================================== */

function show(n) {

  document
    .querySelectorAll('.page')
    .forEach(
      p =>
        p.classList.remove('active')
    );


  document
    .getElementById('p' + n)
    .classList.add('active');


  /* 第三页显示时 */

  if (n === 3) {

    const d =
      new Date();


    document
      .getElementById('d')
      .innerHTML =
        d.getFullYear()
        + '年'
        + (d.getMonth() + 1)
        + '月'
        + d.getDate()
        + '日';


    const saved =
      localStorage.getItem('l');


    document
      .getElementById('txt')
      .value =
        saved || txt;

  }

}


/* =====================================
   第一页 → 第二页
===================================== */

function startExperience() {

  startMusic();

  show(2);

}


/* =====================================
   打开信封
===================================== */

function openEnvelope() {

  const box =
    document.getElementById(
      'envelopeBox'
    );


  if (
    box.classList.contains('open')
  ) {

    return;

  }


  /* 信封打开 */

  box.classList.add('open');


  /* 等待动画结束 */

  setTimeout(
    function() {

      show(3);

    },
    1200
  );

}


/* =====================================
   保存信件
===================================== */

document
  .getElementById('txt')
  .addEventListener(
    'input',
    e => {

      localStorage.setItem(
        'l',
        e.target.value
      );

    }
  );


/* =====================================
   创建花瓣
===================================== */

const petalBox =
  document.getElementById(
    'petals'
  );


const petalCount = 22;


for (
  let i = 0;
  i < petalCount;
  i++
) {

  const petal =
    document.createElement(
      'span'
    );


  petal.className =
    'petal';


  /* 随机位置 */

  petal.style.left =
    Math.random() * 100 + '%';


  /* 随机大小 */

  const scale =
    .6 +
    Math.random() * .8;


  petal.style.transform =
    `rotate(${Math.random() * 360}deg) scale(${scale})`;


  /* 随机下落速度 */

  const fall =
    8 +
    Math.random() * 9;


  /* 随机摆动 */

  const sway =
    3 +
    Math.random() * 3;


  petal.style.animationDuration =
    `${fall}s, ${sway}s`;


  /* 随机开始时间 */

  petal.style.animationDelay =
    `${-Math.random() * 12}s, ${-Math.random() * 4}s`;


  petalBox.appendChild(
    petal
  );

}


/* =====================================
   原创舒缓音乐
===================================== */

let audioContext =
  null;


let musicPlaying =
  false;


let musicTimer =
  null;


let musicStep =
  0;


/* 音符 */

const melody = [

  523.25,
  659.25,
  783.99,
  659.25,

  587.33,
  698.46,
  880.00,
  698.46,

  523.25,
  659.25,
  783.99,
  987.77,

  880.00,
  783.99,
  659.25,
  523.25,

  440.00,
  523.25,
  659.25,
  783.99,

  698.46,
  659.25,
  523.25,
  440.00

];


/* =====================================
   播放音符
===================================== */

function playNote(
  frequency,
  duration
) {

  if (!audioContext) {

    return;

  }


  const now =
    audioContext.currentTime;


  const oscillator =
    audioContext
      .createOscillator();


  const gain =
    audioContext
      .createGain();


  oscillator.type =
    'sine';


  oscillator
    .frequency
    .setValueAtTime(
      frequency,
      now
    );


  gain.gain
    .setValueAtTime(
      0,
      now
    );


  gain.gain
    .linearRampToValueAtTime(
      0.045,
      now + .08
    );


  gain.gain
    .exponentialRampToValueAtTime(
      .001,
      now + duration
    );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start(
    now
  );


  oscillator.stop(
    now + duration
  );

}


/* =====================================
   播放旋律
===================================== */

function playMelody() {

  if (!musicPlaying) {

    return;

  }


  const note =
    melody[musicStep];


  playNote(
    note,
    1.8
  );


  musicStep =
    (
      musicStep + 1
    )
    %
    melody.length;


  musicTimer =
    setTimeout(
      playMelody,
      1600
    );

}


/* =====================================
   开始音乐
===================================== */

function startMusic() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if (
    audioContext.state ===
    'suspended'
  ) {

    audioContext.resume();

  }


  if (musicPlaying) {

    return;

  }


  musicPlaying =
    true;


  musicStep =
    0;


  document
    .getElementById('musicBtn')
    .classList.add('show');


  document
    .getElementById('musicBtn')
    .innerHTML =
      '♫ 音乐：播放中';


  playMelody();

}


/* =====================================
   关闭音乐
===================================== */

function stopMusic() {

  musicPlaying =
    false;


  clearTimeout(
    musicTimer
  );


  document
    .getElementById('musicBtn')
    .innerHTML =
      '♫ 音乐：关闭';

}


/* =====================================
   音乐按钮
===================================== */

document
  .getElementById('musicBtn')
  .addEventListener(
    'click',
    function() {

      if (musicPlaying) {

        stopMusic();

      } else {

        startMusic();

      }

    }
  );


</script>

</body>
</html>
