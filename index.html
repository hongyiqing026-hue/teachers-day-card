<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>给老师的一封信</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", Arial; background: #f5f0e6; height: 100vh; overflow: hidden; }
    
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; }
    .screen.show { display: flex; }
    
    /* 封面屏 */
    #screen1 { background: linear-gradient(135deg, #f8f1e3, #e8d9c4); }
    .cover-title { font-size: 40px; color: #8b5a2b; margin: 30px 0; font-weight: bold; }
    .cover-desc { font-size: 16px; color: #7a6a5a; margin: 20px 0; }
    .open-btn { padding: 15px 40px; background: #8b5a2b; color: white; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; margin-top: 30px; }
    .open-btn:active { transform: scale(0.95); }
    
    /* 信封屏 */
    #screen2 { background: radial-gradient(ellipse at center, #f7f0e4 0%, #d4c4a8 100%); }
    .envelope { width: 280px; height: 200px; background: linear-gradient(145deg, #f0e6d4, #e2d4bc); border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); position: relative; cursor: pointer; transition: all 0.8s ease; }
    .envelope.opened { transform: translateY(-40px) rotateX(20deg); }
    
    .envelope-flap { position: absolute; top: 0; left: 0; width: 100%; height: 100px; background: linear-gradient(180deg, #e8dcc8, #d9cbb0); clip-path: polygon(0 0, 50% 80%, 100% 0); transition: transform 0.8s ease; transform-origin: top center; }
    .envelope.opened .envelope-flap { transform: rotateX(-160deg); }
    
    .seal { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 65px; height: 65px; background: radial-gradient(circle at 35% 30%, #c0392b, #8b1a1a 70%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffe6b4; font-size: 28px; font-weight: bold; box-shadow: 0 6px 16px rgba(100,20,20,0.35); z-index: 10; cursor: pointer; }
    
    .tip { position: absolute; bottom: -50px; width: 100%; text-align: center; font-size: 14px; color: #8a7a6a; }
    
    /* 信纸屏 */
    #screen3 { background: linear-gradient(180deg, #f5efe4 0%, #ebe2d2 100%); overflow-y: auto; padding: 20px; }
    .letter { width: 100%; max-width: 420px; margin: 0 auto; background: #faf6ef; padding: 40px 25px; border-radius: 2px; box-shadow: 0 8px 32px rgba(80,50,20,0.12); }
    .letter-title { text-align: center; font-size: 18px; color: #8b5a2b; margin-bottom: 20px; font-weight: bold; }
    .letter-text { font-size: 15px; line-height: 1.8; color: #4a3f35; min-height: 250px; padding: 15px; border: 1px solid #e8dfd0; border-radius: 3px; outline: none; resize: none; white-space: pre-wrap; word-break: break-word; }
    .letter-date { text-align: right; font-size: 12px; color: #9a8a7a; margin-top: 15px; }
    .letter-buttons { display: flex; gap: 15px; margin-top: 20px; justify-content: center; }
    .letter-buttons button { padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer; font-size: 15px; }
    .btn-primary { background: #8b5a2b; color: white; }
    .btn-primary:active { transform: scale(0.95); }
    
    /* 祝福屏 */
    #screen4 { background: linear-gradient(160deg, #f8f1e3, #d9c4a8); }
    .bless { text-align: center; }
    .bless-title { font-size: 36px; color: #8b5a2b; margin-bottom: 30px; font-weight: bold; }
    .bless-text { font-size: 15px; line-height: 2.2; color: #6a5a4a; margin-bottom: 40px; }
    .bless-seal { width: 80px; height: 80px; background: radial-gradient(circle at 30% 25%, #c0392b, #8b1a1a); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffe6b4; font-size: 36px; font-weight: bold; margin: 0 auto; box-shadow: 0 6px 16px rgba(100,20,20,0.3); }
  </style>
</head>
<body>

<!-- 屏幕1：封面 -->
<div id="screen1" class="screen show">
  <div class="cover-title">给您的一封信</div>
  <div class="cover-desc">教师节 · 专属祝福</div>
  <button class="open-btn" onclick="nextScreen(2)">打开信封</button>
</div>

<!-- 屏幕2：信封 -->
<div id="screen2" class="screen">
  <div class="envelope" id="envelope" onclick="openEnvelope()">
    <div class="envelope-flap"></div>
    <div class="seal"></div>
    <div class="tip">点击红色印章打开</div>
  </div>
</div>

<!-- 屏幕3：信纸 -->
<div id="screen3" class="screen">
  <div class="letter">
    <div class="letter-title">敬爱的老师</div>
    <textarea class="letter-text" id="letterText" placeholder="写下你的祝福..."></textarea>
    <div class="letter-date" id="letterDate"></div>
    <div class="letter-buttons">
      <button class="btn-primary" onclick="nextScreen(4)">完成 · 祝福</button>
    </div>
  </div>
</div>

<!-- 屏幕4：祝福 -->
<div id="screen4" class="screen">
  <div class="bless">
    <div class="bless-title">教师节快乐</div>
    <div class="bless-text">
      愿您桃李满天下<br>
      春晖遍四方<br><br>
      感谢您用知识点亮前路<br>
      用温暖守护成长
    </div>
    <div class="bless-seal">師</div>
  </div>
</div>

<script>
  const defaultLetter = `老师您好：

时光匆匆，转眼又是一年教师节。

还记得课堂上您耐心讲解的样子，记得您鼓励的眼神。

谢谢您不仅教会了我知识，更教会了我如何认真对待生活、如何保持好奇与善良。

愿您身体安康，事事顺心，桃李满天下。

教师节快乐！`;

  let envelopeOpened = false;

  function nextScreen(n) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
    document.getElementById('screen' + n).classList.add('show');
    
    if (n === 3) {
      const now = new Date();
      document.getElementById('letterDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
      
      const saved = localStorage.getItem('teacherLetter');
      document.getElementById('letterText').value = saved || defaultLetter;
    }
  }

  function openEnvelope() {
    if (envelopeOpened) return;
    envelopeOpened = true;
    
    const envelope = document.getElementById('envelope');
    envelope.classList.add('opened');
    
    setTimeout(() => {
      nextScreen(3);
    }, 800);
  }

  // 保存信件内容
  document.addEventListener('DOMContentLoaded', function() {
    const letterText = document.getElementById('letterText');
    letterText.addEventListener('input', function() {
      localStorage.setItem('teacherLetter', this.value);
    });
  });
</script>

</body>
</html>
