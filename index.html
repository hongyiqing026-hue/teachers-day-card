<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>给老师的一封信</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f0e6; height: 100vh; overflow: hidden; }
    
    .page { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
    .page.active { display: flex; }
    
    /* 页面1 - 封面 */
    #page1 { background: linear-gradient(135deg, #f8f1e3, #e8d9c4); }
    #page1 h1 { font-size: 48px; color: #8b5a2b; margin-bottom: 20px; }
    #page1 p { font-size: 18px; color: #7a6a5a; margin-bottom: 40px; }
    
    /* 页面2 - 信封 */
    #page2 { background: #e8dcc8; }
    .envelope-container { width: 300px; height: 220px; background: #f0e6d4; border: 2px solid #d9cbb0; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    
    .envelope-top { width: 100%; height: 40%; background: linear-gradient(180deg, #e8dcc8, #d9cbb0); border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; }
    
    .envelope-bottom { width: 100%; height: 60%; background: #f0e6d4; border-radius: 0 0 8px 8px; display: flex; align-items: center; justify-content: center; }
    
    .seal { width: 70px; height: 70px; background: radial-gradient(circle at 35% 30%, #c0392b, #8b1a1a 70%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffe6b4; font-size: 32px; font-weight: bold; box-shadow: 0 6px 16px rgba(100,20,20,0.35); cursor: pointer; }
    
    .seal:active { transform: scale(0.95); }
    
    .tip { position: absolute; bottom: -60px; text-align: center; font-size: 14px; color: #8a7a6a; width: 100%; }
    
    /* 页面3 - 信纸 */
    #page3 { background: linear-gradient(180deg, #f5efe4 0%, #ebe2d2 100%); overflow-y: auto; }
    .letter-box { width: 100%; max-width: 420px; background: #faf6ef; padding: 40px 25px; border-radius: 4px; box-shadow: 0 8px 32px rgba(80,50,20,0.12); }
    .letter-box h2 { text-align: center; font-size: 20px; color: #8b5a2b; margin-bottom: 20px; }
    .letter-box textarea { width: 100%; height: 300px; padding: 15px; font-size: 15px; line-height: 1.8; border: 1px solid #e8dfd0; border-radius: 3px; font-family: Arial; resize: none; }
    .letter-date { text-align: right; font-size: 12px; color: #9a8a7a; margin-top: 10px; }
    .letter-box button { margin-top: 20px; padding: 12px 40px; background: #8b5a2b; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; width: 100%; }
    .letter-box button:active { transform: scale(0.95); }
    
    /* 页面4 - 祝福 */
    #page4 { background: linear-gradient(160deg, #f8f1e3, #d9c4a8); }
    .bless { text-align: center; }
    .bless h1 { font-size: 44px; color: #8b5a2b; margin-bottom: 40px; }
    .bless p { font-size: 16px; line-height: 2; color: #6a5a4a; margin-bottom: 40px; }
    .bless-seal { width: 90px; height: 90px; background: radial-gradient(circle at 30% 25%, #c0392b, #8b1a1a); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffe6b4; font-size: 44px; font-weight: bold; margin: 0 auto; box-shadow: 0 6px 16px rgba(100,20,20,0.3); }
    
    /* 通用按钮 */
    button { font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<!-- 页面1：封面 -->
<div id="page1" class="page active">
  <h1>给您的一封信</h1>
  <p>教师节 · 专属祝福</p>
  <button onclick="showPage(2)" style="padding: 15px 40px; background: #8b5a2b; color: white; border: none; border-radius: 30px; font-size: 18px;">打开信封</button>
</div>

<!-- 页面2：信封 -->
<div id="page2" class="page">
  <div class="envelope-container">
    <div class="envelope-top"></div>
    <div class="envelope-bottom"></div>
    <div class="seal" onclick="openAndGo()">師</div>
    <div class="tip">点击印章打开</div>
  </div>
</div>

<!-- 页面3：信纸 -->
<div id="page3" class="page">
  <div class="letter-box">
    <h2>敬爱的老师</h2>
    <textarea id="letterText" placeholder="写下你的祝福..."></textarea>
    <div class="letter-date" id="letterDate"></div>
    <button onclick="showPage(4)">完成 · 祝福</button>
  </div>
</div>

<!-- 页面4：祝福 -->
<div id="page4" class="page">
  <div class="bless">
    <h1>教师节快乐</h1>
    <p>愿您桃李满天下<br>春晖遍四方<br><br>感谢您用知识点亮前路<br>用温暖守护成长</p>
    <div class="bless-seal">師</div>
  </div>
</div>

<script>
  const defaultLetter = `老师您好：

时光匆匆，转眼又是一年教师节。

还记得课堂上您耐心讲解的样子，记得您鼓励的眼神。

谢谢您不仅教会了我知识，更教会了我如何认真对待生活、如何保持好奇与善良。

愿您身体安康，事事顺心，桃李满天下。

教师节快乐！`;

  function showPage(n) {
    const pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.remove('active'));
    document.getElementById('page' + n).classList.add('active');
    
    if (n === 3) {
      const now = new Date();
      const dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
      document.getElementById('letterDate').textContent = dateStr;
      
      const saved = localStorage.getItem('teacherLetter');
      document.getElementById('letterText').value = saved || defaultLetter;
    }
  }

  function openAndGo() {
    showPage(3);
  }

  // 自动保存信件
  document.getElementById('letterText').addEventListener('input', function() {
    localStorage.setItem('teacherLetter', this.value);
  });

  // 页面加载完成
  window.addEventListener('load', function() {
    const saved = localStorage.getItem('teacherLetter');
    if (saved) {
      document.getElementById('letterText').value = saved;
    }
  });
</script>

</body>
</html>
