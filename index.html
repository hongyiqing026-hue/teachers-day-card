<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>给老师的一封信 · 教师节</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", sans-serif; background: #f5f0e6; color: #4a3f35; height: 100vh; overflow: hidden; }
    
    .page { display: none; width: 100%; height: 100%; }
    .page.active { display: flex; }
    
    /* 页面1：封面 */
    #page1 { background: linear-gradient(165deg, #f8f1e3 0%, #d9cbb8 100%); flex-direction: column; align-items: center; justify-content: center; }
    .page1-content { text-align: center; }
    .page1-content h1 { font-size: 32px; margin: 20px 0; color: #8b5a2b; }
    .page1-content p { font-size: 16px; color: #7a6a5a; margin-bottom: 40px; }
    .page1-btn { padding: 15px 50px; background: #8b5a2b; color: white; border: none; border-radius: 30px; font-size: 16px; cursor: pointer; }
    .page1-btn:active { transform: scale(0.95); }
    
    /* 页面2：信封 */
    #page2 { background: radial-gradient(ellipse at center, #f7f0e4 0%, #d4c4a8 100%); flex-direction: column; align-items: center; justify-content: center; }
    .envelope-box { width: 280px; height: 200px; background: linear-gradient(145deg, #f0e6d4, #e2d4bc); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .seal { width: 70px; height: 70px; background: radial-gradient(circle at 30% 25%, #c0392b, #8b1a1a); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffe6b4; font-size: 32px; font-weight: bold; box-shadow: 0 5px 15px rgba(100,20,20,0.3); transition: all 0.3s; }
    .envelope-box:active .seal { transform: scale(1.2); }
    .envelope-tip { margin-top: 50px; font-size: 14px; color: #8a7a6a; }
    
    /* 页面3：信纸 */
    #page3 { background: linear-gradient(180deg, #f5efe4 0%, #ebe2d2 100%); flex-direction: column; align-items: center; justify-content: flex-start; overflow-y: auto; padding-top: 20px; }
    .letter-box { width: 90%; max-width: 400px; background: #faf6ef; padding: 30px 20px; border-radius: 4px; box-shadow: 0 5px 20px rgba(80,50,20,0.15); }
    .letter-box h2 { text-align: center; font-size: 20px; color: #8b5a2b; margin-bottom: 20px; }
    .letter-content { font-size: 15px; line-height: 1.8; color: #4a3f35; min-height: 300px; padding: 10px; border: 1px solid #e8dfd0; border-radius: 3px; outline: none; white-space: pre-wrap; word-break: break-word; }
    .letter-date { text-align: right; font-size: 12px; color: #9a8a7a; margin-top: 15px; }
    .letter-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
    .letter-actions button { padding: 10px 30px; border: none; border-radius: 25px; cursor: pointer; font-size: 14px; }
    .btn-finish { background: #8b5a2b; color: white; }
    .btn-finish:active { transform: scale(0.95); }
    
    /* 页面4：祝福 */
    #page4 { background: linear-gradient(160deg, #f8f1e3, #d9c4a8); flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .bless-box h1 { font-size: 36px; color: #8b5a2b; margin-bottom: 20px; }
    .bless-box p { font-size: 16px; line-height: 2; color: #6a5a4a; margin-bottom: 30px; }
    .bless-seal { width: 80px; height: 80px; background: radial-gradient(circle at 30% 25%, #c0392b, #8b1a1a); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffe6b4; font-size: 36px; font-weight: bold; margin: 0 auto; box-shadow: 0 5px 15px rgba(100,20,20,0.3); }
  </style>
</head>
<body>
  <!-- 页面1：封面 -->
  <div id="page1" class="page active">
    <div class="page1-content">
      <h1>给您的一封信</h1>
      <p>教师节 · 专属祝福</p>
      <button class="page1-btn" onclick="goPage(2)">打开信封</button>
    </div>
  </div>

  <!-- 页面2：信封 -->
  <div id="page2" class="page">
    <div class="envelope-box" onclick="goPage(3)">
      <div class="seal">師</div>
    </div>
    <div class="envelope-tip">点击印章打开</div>
  </div>

  <!-- 页面3：信纸 -->
  <div id="page3" class="page">
    <div class="letter-box">
      <h2>敬爱的老师</h2>
      <div class="letter-content" id="letterContent" contenteditable="true"></div>
      <div class="letter-date" id="letterDate"></div>
      <div class="letter-actions">
        <button class="btn-finish" onclick="goPage(4)">完成 · 祝福</button>
      </div>
    </div>
  </div>

  <!-- 页面4：祝福 -->
  <div id="page4" class="page">
    <div class="bless-box">
      <h1>教师节快乐</h1>
      <p>愿您桃李满天下<br>春晖遍四方<br><br>感谢您用知识点亮前路<br>用温暖守护成长</p>
      <div class="bless-seal">師</div>
    </div>
  </div>

  <script>
    const defaultText = `老师您好：

时光匆匆，转眼又是一年教师节。

还记得课堂上您耐心讲解的样子，记得您鼓励的眼神。

谢谢您不仅教会了我知识，更教会了我如何认真对待生活、如何保持好奇与善良。

愿您身体安康，事事顺心，桃李满天下。

教师节快乐！`;

    function goPage(n) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page' + n).classList.add('active');
      
      if (n === 3) {
        const now = new Date();
        document.getElementById('letterDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
        const saved = localStorage.getItem('teacherLetter');
        document.getElementById('letterContent').textContent = saved || defaultText;
      }
    }

    document.getElementById('letterContent').addEventListener('change', function() {
      localStorage.setItem('teacherLetter', this.textContent);
    });

    // 初始化日期
    const now = new Date();
    document.getElementById('letterDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  </script>
</body>
</html>
